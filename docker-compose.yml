version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26034_backend
    ports:
      - "8080:8000"
    environment:
      - SECRET_KEY=sih26034-legal-metrology-secret-2026
      - DATABASE_URL=sqlite:///storage/legal_metrology.db
      - STORAGE_DIR=/app/storage
      - REPORTS_DIR=/app/storage/reports
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5:7b
      # Defect Inspection mode: hybrid (YOLOv8 ONNX + OpenCV) | opencv | onnx
      - DEFECT_DETECTOR_BACKEND=hybrid
      - DEFECT_MODEL_PATH=storage/models/best.onnx
      - DEFECT_MODEL_CLASSES=scratch,crack,dent,discolouration
      - DEFECT_SAMPLES_DIR=/app/storage/defect_samples
    volumes:
      - backend_storage:/app/storage
      # Bind-mounted so the model is present even when backend_storage already exists
      - ./backend/storage/models:/app/storage/models:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26034_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage:
